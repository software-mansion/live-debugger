name: Playwright

on:
  push:
    branches:
      - main
      - "v*.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Install inotify-tools
        run: sudo apt-get update && sudo apt-get install -y inotify-tools

      - name: Set up Elixir
        uses: erlef/setup-beam@v1.20.4
        with:
          # playwright_ex needs Elixir 1.18 or later
          elixir-version: "1.19.1"
          otp-version: "28.1.1"

      - name: Cache Mix
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install Mix Dependencies
        run: mix deps.get

      # mix.lock pins the playwright_ex driver and so the browser revisions
      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/playwright
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('mix.lock') }}

      - name: Install Playwright Dependencies
        run: mix playwright.install chromium firefox --with-deps

      # Up to two retries of the failed tests, as the `retries: 2` of Playwright Test. An empty
      # rerun (nothing failed but a module) must not pass.
      - name: Run Playwright tests
        run: |
          set -o pipefail
          mix e2e --max-failures 5 || { [ $? -eq 2 ] && mix e2e --failed | tee "$RUNNER_TEMP/retry.log" && ! grep -q "There are no tests to run" "$RUNNER_TEMP/retry.log"; } || { [ $? -eq 2 ] && mix e2e --failed | tee "$RUNNER_TEMP/retry.log" && ! grep -q "There are no tests to run" "$RUNNER_TEMP/retry.log"; }

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 1
          if-no-files-found: ignore
