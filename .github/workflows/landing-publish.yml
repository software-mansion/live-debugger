name: Live-debugger landing page publish
on:
  push:
    paths:
      - ".github/workflows/landing-publish.yml"
      - landing/**
    branches:
      - main
  workflow_dispatch:

jobs:
  live-debugger-landing-publish:
    if: github.repository == 'software-mansion/live-debugger'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: "true"
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          cache: "npm"
          cache-dependency-path: landing/package-lock.json
      - name: Install node dependencies
        working-directory: landing
        run: npm install
      - name: Build landing page
        working-directory: landing
        env:
          ENABLE_ANALYTICS: ${{ vars.ENABLE_ANALYTICS || 'false' }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY || '' }}
        run: npm run build

      - name: Check docs llms.txt
        run: |
          file=landing/dist/llms.txt
          if [ ! -s "$file" ]; then
            echo "::error::$file is missing or empty"
            exit 1
          fi
          count=$(grep -cE '^- \[[^]]+\]\(https://docs\.swmansion\.com/live-debugger/[^)]+\)' "$file" || true)
          if [ "$count" -eq 0 ]; then
            echo "::error::$file lists no pages"
            exit 1
          fi
          echo "llms.txt lists $count pages"
      - name: Publish generated content to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@releases/v3
        with:
          FOLDER: landing/dist
          BRANCH: gh-pages
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
